<header class="site-header">
  <div class="bar">
    <a class="logo" routerLink="/" (click)="closeMobileMenu()" aria-label="回首頁">
      <img src="icon-64.png" alt="" width="40" height="40" />
      <span>三峽白雞觀光商場</span>
    </a>

    <button
      class="menu-toggle"
      type="button"
      mat-icon-button
      (click)="toggleMobileMenu()"
      [attr.aria-expanded]="mobileMenuOpen()"
      aria-label="開啟選單"
    >
      <mat-icon>{{ mobileMenuOpen() ? 'close' : 'menu' }}</mat-icon>
    </button>

    <nav class="main-nav" [class.open]="mobileMenuOpen()">
      <a routerLink="/traffic" routerLinkActive="active" (click)="closeMobileMenu()">交通方式</a>
      <a routerLink="/shop" routerLinkActive="active" (click)="closeMobileMenu()">商場店家</a>

      <button class="nav-dropdown-trigger" mat-button [matMenuTriggerFor]="nearbyMenu">
        周邊景點 <mat-icon iconPositionEnd>expand_more</mat-icon>
      </button>
      <mat-menu #nearbyMenu="matMenu">
        <a mat-menu-item href="https://www.ht.org.tw/" target="_blank" rel="noopener">
          行脩宮 <mat-icon inline>open_in_new</mat-icon>
        </a>
        <a mat-menu-item routerLink="/nearby/sanxia-attractions" (click)="closeMobileMenu()">
          周邊三峽景點
        </a>
      </mat-menu>

      <a routerLink="/hiking" routerLinkActive="active" (click)="closeMobileMenu()">登山資訊</a>
      <a class="market-cta" routerLink="/market" routerLinkActive="active" (click)="closeMobileMenu()">
        商場介紹
      </a>
    </nav>
  </div>
</header>
